<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lanshare, simple file sharing across your devices."
    />
    <title>Lanshare</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section class="downloads" id="downloads">
        <div class="section-heading">
          <span>DOWNLOADS</span>
          <h2 id="release-title">Checking for releases…</h2>
        </div>

        <div class="download-list" id="download-list">
          <p class="loading">Fetching latest release from GitHub…</p>
        </div>

        <p class="error" id="release-error" hidden>
          Could not fetch the latest release.
          <a
            href="https://github.com/getawife/lanshare/releases"
            target="_blank"
            rel="noopener noreferrer"
          >
            Browse releases on GitHub
          </a>
        </p>

        <a
          class="release-link"
          id="release-link"
          href="https://github.com/getawife/lanshare/releases"
          target="_blank"
          rel="noopener noreferrer"
        >
          View release on GitHub
        </a>
      </section>
    </main>

    <script>
      (function () {
        const repo = "getawife/lanshare";
        const api = `https://api.github.com/repos/${repo}/releases/latest`;
        const cache_key = "lanshare_latest_release";
        const cache_ttl_ms = 10 * 60 * 1000;

        const title_el = document.getElementById("release-title");
        const list_el = document.getElementById("download-list");
        const error_el = document.getElementById("release-error");
        const link_el = document.getElementById("release-link");

        function classify(name) {
          const lower = name.toLowerCase();

          if (lower.endsWith(".exe")) {
            if (lower.includes("arm64"))
              return {
                platform: "Windows",
                detail: "ARM64, Windows 10+",
                rank: 1,
              };
            if (lower.includes("ia32"))
              return {
                platform: "Windows",
                detail: "x86, Windows 10+",
                rank: 3,
              };
            return { platform: "Windows", detail: "x64, Windows 10+", rank: 2 };
          }

          if (lower.endsWith(".dmg")) {
            if (lower.includes("arm64"))
              return {
                platform: "macOS",
                detail: "Apple Silicon, ARM64",
                rank: 1,
              };
            if (lower.includes("universal"))
              return { platform: "macOS", detail: "Universal", rank: 2 };
            return { platform: "macOS", detail: "Intel, x64", rank: 3 };
          }

          if (lower.endsWith(".appimage")) {
            if (lower.includes("arm64"))
              return { platform: "Linux", detail: "ARM64, AppImage", rank: 1 };
            return { platform: "Linux", detail: "x64, AppImage", rank: 2 };
          }

          if (lower.endsWith(".deb")) {
            if (lower.includes("arm64"))
              return {
                platform: "Linux",
                detail: "ARM64, Debian / Ubuntu",
                rank: 3,
              };
            return {
              platform: "Linux",
              detail: "x64, Debian / Ubuntu",
              rank: 4,
            };
          }

          if (lower.endsWith(".rpm")) {
            if (lower.includes("arm64"))
              return {
                platform: "Linux",
                detail: "ARM64, Fedora / RHEL",
                rank: 5,
              };
            return { platform: "Linux", detail: "x64, Fedora / RHEL", rank: 6 };
          }

          return null;
        }

        function short_digest(digest) {
          if (!digest) return null;
          return digest.startsWith("sha256:") ? digest.slice(7) : digest;
        }

        function escape_html(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function render(downloads, version) {
          document.title = `Lanshare ${version}`;
          title_el.textContent = `Lanshare ${version}`;

          list_el.innerHTML = downloads
            .map((d) => {
              const digest_block = d.checksum
                ? `<code title="SHA-256">${escape_html(d.checksum)}</code>`
                : "";

              return `
                <article class="download">
                  <div class="download-info">
                    <div class="platform">${escape_html(d.platform)}</div>
                    <h3>${escape_html(d.name)}</h3>
                    <p>${escape_html(d.detail)}</p>
                  </div>
                  <div class="download-action">
                    <a href="${escape_html(d.url)}">Download</a>
                    ${digest_block}
                  </div>
                </article>
              `;
            })
            .join("");
        }

        function parse_release(release) {
          const version = (release.tag_name || "").replace(/^v/, "");

          const downloads = (release.assets || [])
            .map((asset) => {
              const info = classify(asset.name);
              if (!info) return null;
              return {
                name: asset.name,
                url: asset.browser_download_url,
                platform: info.platform,
                detail: info.detail,
                rank: info.rank,
                checksum: short_digest(asset.digest),
              };
            })
            .filter(Boolean)
            .sort((a, b) => a.rank - b.rank);

          return { version, downloads, html_url: release.html_url };
        }

        function read_cache() {
          try {
            const raw = sessionStorage.getItem(cache_key);
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            if (!parsed || Date.now() - parsed.saved_at > cache_ttl_ms)
              return null;
            return parsed;
          } catch {
            return null;
          }
        }

        function write_cache(payload) {
          try {
            sessionStorage.setItem(
              cache_key,
              JSON.stringify({ saved_at: Date.now(), ...payload }),
            );
          } catch {
            void 0;
          }
        }

        async function load() {
          const cached = read_cache();
          if (cached) {
            apply(cached);
            return;
          }

          try {
            const response = await fetch(api, {
              headers: { Accept: "application/vnd.github+json" },
            });

            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const release = await response.json();
            const parsed = parse_release(release);

            if (parsed.downloads.length === 0) {
              throw new Error("No matching assets in latest release");
            }

            write_cache(parsed);
            apply(parsed);
          } catch (err) {
            console.error("[releases] fetch failed:", err);
            title_el.textContent = "Downloads";
            list_el.innerHTML = "";
            error_el.hidden = false;
          }
        }

        function apply(parsed) {
          render(parsed.downloads, parsed.version);
          link_el.href = parsed.html_url;
          link_el.textContent = `View release v${parsed.version} on GitHub ↗`;
        }

        load();
      })();
    </script>
  </body>
</html>
