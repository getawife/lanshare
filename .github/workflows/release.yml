name: Build and Release

on:
push:
tags:
- "v*"

permissions:
contents: write

jobs:
windows:
runs-on: windows-latest


defaults:
  run:
    working-directory: client

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 10

  - name: Install dependencies
    run: pnpm install --frozen-lockfile

  - name: Build backend
    shell: pwsh
    working-directory: backend
    run: ./scripts/build-backend.ps1

  - name: Build Windows app
    run: pnpm dist:win

  - name: Upload Windows artifacts
    uses: actions/upload-artifact@v4
    with:
      name: windows
      path: releases/windows/*


macos:
runs-on: macos-14


defaults:
  run:
    working-directory: client

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 10

  - name: Install dependencies
    run: pnpm install --frozen-lockfile

  - name: Setup Go
    uses: actions/setup-go@v5
    with:
      go-version: "1.25"

  - name: Build macOS backend
    working-directory: backend
    run: 
      mkdir -p ../client/backend/macos/arm64
      GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../client/backend/macos/arm64/lanshare-backend .

  - name: Make backend executable
    run: chmod +x backend/macos/arm64/lanshare-backend

  - name: Build macOS app
    run: pnpm dist:mac

  - name: Upload macOS artifacts
    uses: actions/upload-artifact@v4
    with:
      name: macos
      path: releases/mac/*


linux:
runs-on: ubuntu-24.04


defaults:
  run:
    working-directory: client

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 10

  - name: Install dependencies
    run: pnpm install --frozen-lockfile

  - name: Setup Go
    uses: actions/setup-go@v5
    with:
      go-version: "1.25"

  - name: Build Linux backends
    working-directory: backend
    run: 
      mkdir -p ../client/backend/linux/x64
      mkdir -p ../client/backend/linux/arm64
      GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../client/backend/linux/x64/lanshare-backend .
      GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../client/backend/linux/arm64/lanshare-backend .

  - name: Make backends executable
    run: 
      chmod +x backend/linux/x64/lanshare-backend
      chmod +x backend/linux/arm64/lanshare-backend

  - name: Build Linux app
    run: pnpm dist:linux

  - name: Upload Linux artifacts
    uses: actions/upload-artifact@v4
    with:
      name: linux
      path: releases/linux/*


release:
runs-on: ubuntu-latest
needs:
- windows
- macos
- linux


steps:
  - name: Download Windows artifacts
    uses: actions/download-artifact@v4
    with:
      name: windows
      path: release-assets

  - name: Download macOS artifacts
    uses: actions/download-artifact@v4
    with:
      name: macos
      path: release-assets

  - name: Download Linux artifacts
    uses: actions/download-artifact@v4
    with:
      name: linux
      path: release-assets

  - name: Create GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      files: release-assets/**/*
      generate_release_notes: true

